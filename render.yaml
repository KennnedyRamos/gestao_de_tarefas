services:
  - type: web
    name: gestao-tarefas-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/db
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        # Para novas instâncias criadas pelo Blueprint, o Render gera e mantém
        # uma chave aleatória de 256 bits em vez de depender de um placeholder.
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: APP_ENV
        value: production
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: LOGIN_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: LOGIN_RATE_LIMIT_MAX_ATTEMPTS
        value: "5"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrador
      - key: ADMIN_ROLE
        value: admin
      - key: CORS_ORIGINS
        sync: false
      # No plano Free do Render, prefira Supabase Storage para persistir PDFs.
      # Se for usar disco persistente (pago), ajuste UPLOADS_DIR para /var/data/uploads.
      - key: UPLOADS_DIR
        value: uploads
      - key: DELIVERY_STORAGE_BACKEND
        value: supabase
      - key: DB_BOOTSTRAP_MODE
        value: sync
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: deliveries
      - key: SUPABASE_STORAGE_PREFIX
        value: deliveries
      - key: SUPABASE_STORAGE_LEGACY_PATHS
        value: "true"
